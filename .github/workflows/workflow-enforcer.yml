name: 流程合规检查
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  pull-requests: read
  issues: read
  contents: read
  checks: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: branch_check
        name: 1️⃣ 分支命名
        env:
          # 分支名由 PR 提交方控制 → 经 env 传入，避免 shell 注入
          BRANCH: ${{ github.head_ref }}
        run: |
          if echo "$BRANCH" | grep -qE '^feat/issue-[0-9]+-|^fix/|^chore/|^dependabot/|^renovate/'; then
            echo "✅ 分支名: $BRANCH"
          else
            echo "❌ 分支名不合规: $BRANCH"
            echo "允许: feat/issue-<数字>-*, fix/*, chore/*, dependabot/*"
            exit 1
          fi

      - id: issue_check
        name: 2️⃣ Issue 关联
        run: |
          REPO="${{ github.repository }}"
          PR_NUM=${{ github.event.pull_request.number }}
          # 标题/body 均通过 gh api 获取（避免 shell 插值导致 backtick/括号/引号注入）
          PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUM" --jq '.title, .body // ""')
          TITLE=$(printf '%s\n' "$PR_JSON" | sed -n '1p')
          BODY=$(printf '%s\n' "$PR_JSON" | sed -n '2,$p')
          KEYWORD_PATTERN='(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)[[:space:]]+([Ii]ssue[[:space:]]+)?#[0-9]+'

          REFS=$( { echo "$BODY"; echo "$TITLE"; } | grep -oiE "$KEYWORD_PATTERN" || true )
          if [ -z "$REFS" ]; then
            echo "❌ 未关联 Issue（请在标题或 body 中含 close/fix/resolve #编号）"
            exit 1
          fi
          echo "🔗 关联文本: $(echo "$REFS" | tr '\n' ' ')"

          # 提取被引用的全部编号（去重），逐个校验真实存在
          NUMBERS=$(echo "$REFS" | grep -oE '#[0-9]+' | tr -d '#' | sort -un)
          echo "🔢 待校验编号: $(echo $NUMBERS)"

          FAIL=0
          for N in $NUMBERS; do
            set +e
            INFO=$(gh api "repos/$REPO/issues/$N" \
              --jq '[(if .pull_request then "PR" else "Issue" end), .state, .title] | join(" | ")' 2>&1)
            RC=$?
            set -e
            if [ "$RC" -ne 0 ]; then
              echo "❌ #$N 不存在或无法读取（gh api exit=$RC）：$INFO"
              FAIL=1
              continue
            fi
            if echo "$INFO" | grep -q '^PR |'; then
              echo "❌ #$N 是 Pull Request 而不是 Issue：$INFO"
              echo "   必须关联一个真实存在的 Issue"
              FAIL=1
              continue
            fi
            echo "  ✅ #$N 真实存在 → $INFO"
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "❌ Issue 关联存在性校验未通过（引用了不存在 / 非 Issue 的编号）"
            exit 1
          fi
          echo "✅ 关联 Issue 全部真实存在"

      - id: ownership_check
        name: 3️⃣ 文件所有权
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1 2>/dev/null || true
          # fail-closed：算不出变更列表就拒绝，不允许静默放行
          if ! CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD" 2>/dev/null); then
            echo "❌ 无法计算变更文件列表（origin/$BASE_REF...HEAD 失败）—— 按 fail-closed 处理"
            exit 1
          fi
          if [ -z "$CHANGED" ]; then
            echo "（变更文件列表为空：无文件级变更）"
            exit 0
          fi
          bash .github/scripts/check-ownership.sh "$BASE_REF" $CHANGED

      - id: pr_body_check
        name: 4️⃣ PR 主体完整性
        run: |
          BODY=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            --jq '.body // ""')
          bash .github/scripts/check-pr-body.sh "$BODY"

      - id: lead_check
        name: 5️⃣ LEAD Review（需有 needs-qa / ai-done 标签时检查）
        run: |
          LABELS='${{ toJSON(github.event.pull_request.labels) }}'
          if echo "$LABELS" | grep -qE '"needs-qa"|"ai-done"'; then
            PR_NUM=${{ github.event.pull_request.number }}
            COMMENTS=$(gh api "repos/${{ github.repository }}/issues/$PR_NUM/comments" --jq '.')
            if echo "$COMMENTS" | python3 -c 'import json,sys; [print("OK") or sys.exit(0) for c in json.load(sys.stdin) if "LEAD" in c.get("body","") or "\u5ba1\u67e5" in c.get("body","")]; sys.exit(1)'; then
              echo "✅ LEAD Review 通过"
            else
              echo "❌ 未找到 LEAD Review 评论"
              echo "已在 needs-qa/ai-done 阶段但缺少研发主管审查"
              exit 1
            fi
          else
            echo "⏳ 跳过（未到 QA 阶段）"
          fi

      - id: qa_check
        name: 6️⃣ QA 验收（需有 ai-done 标签时检查）
        run: |
          LABELS='${{ toJSON(github.event.pull_request.labels) }}'
          if echo "$LABELS" | grep -qE '"ai-done"'; then
            PR_NUM=${{ github.event.pull_request.number }}
            COMMENTS=$(gh api "repos/${{ github.repository }}/issues/$PR_NUM/comments" --jq '.')
            if echo "$COMMENTS" | python3 -c 'import json,sys; [print("OK") or sys.exit(0) for c in json.load(sys.stdin) if ("QA" in c.get("body","") or "\u9a8c\u6536" in c.get("body","")) and ("\u901a\u8fc7" in c.get("body","") or "PASS" in c.get("body",""))]; sys.exit(1)'; then
              echo "✅ QA 验收通过"
            else
              echo "❌ 未找到 QA 验收评论"
              echo "标记 ai-done 但缺少 QA 通过记录"
              exit 1
            fi
          else
            echo "⏳ 跳过（未标记 ai-done）"
          fi

      - name: 📋 汇总
        if: always()
        run: |
          echo "========== 流程检查报告 =========="
          echo "分支命名     : ${{ steps.branch_check.outcome }}"
          echo "Issue 关联   : ${{ steps.issue_check.outcome }}"
          echo "文件所有权   : ${{ steps.ownership_check.outcome }}"
          echo "PR body      : ${{ steps.pr_body_check.outcome }}"
          echo "LEAD Review  : ${{ steps.lead_check.outcome }}"
          echo "QA 验收      : ${{ steps.qa_check.outcome }}"
          echo "==================================="
